name: Release

# v1.6 / 2026-06：Release 是本仓库**唯一**自动跑的 workflow。
# 触发条件：
#   1) push tag 形如 v1.2.3   —— 真发版自动走完整打包链路
#   2) workflow_dispatch      —— 临时手动验 release pipeline，不打 tag 也能跑
# 设计意图：日常 push / PR 全部静默（见 ci.yml 注释），把所有 Actions 额度全留给真正的发版。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.0.0）'
        required: true
        default: '1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dmg:
    name: Build & Package DMG
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # v1.5.7：CFBundleVersion 需要 git rev-list --count HEAD 拿到完整历史

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          build_no="$(git rev-list --count HEAD)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=$build_no" >> "$GITHUB_OUTPUT"
          echo "解析版本号: $v (build $build_no)"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Build Release (.app, ad-hoc signed)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        # Step 5.6 番外：CI 上跑 ad-hoc 签名直接用 xcodebuild override，
        # 不走 Scripts/build_release.sh（本地脚本走 .xcodeproj 里的 Personal Team）
        # v1.5.7：注入 CURRENT_PROJECT_VERSION 保证每次 release 的 CFBundleVersion 单调递增
        run: |
          set -o pipefail
          mkdir -p dist
          xcodebuild \
            -project GSYCleanMac.xcodeproj \
            -scheme GSYCleanMac \
            -configuration Release \
            -derivedDataPath build/release \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -200
          ditto build/release/Build/Products/Release/GSYCleanMac.app dist/GSYCleanMac.app
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/GSYCleanMac.app/Contents/Info.plist)
          echo "Built CFBundleVersion = $ACTUAL_BUILD"
          if [ "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::CFBundleVersion 注入失败：期望 $BUILD_NUMBER，实际 $ACTUAL_BUILD"
            exit 1
          fi

      - name: Re-sign with Hardened Runtime (ad-hoc)
        # v1.5.7：xcodebuild 走 ad-hoc 默认不开 Hardened Runtime；这里手动重签注入
        #   --options runtime    启用 Hardened Runtime（阻止 dyld 注入 / 未签名 dylib 加载）
        #   --timestamp=none     ad-hoc 无 Apple 时间戳服务器，跳过
        #   --entitlements       保留 user-selected r/w + 全盘只读 exception
        # 没有 Developer ID 拿不到 Notarization，但 Hardened Runtime 是离线能力，免费账号也能用
        # 等同 Rectangle / AltTab 的安全等级（这些 App 现在也是 ad-hoc + Hardened Runtime）
        run: |
          set -euxo pipefail
          codesign --force --sign - \
            --options runtime \
            --timestamp=none \
            --entitlements App/GSYCleanMac.entitlements \
            dist/GSYCleanMac.app
          codesign --verify --strict --verbose=2 dist/GSYCleanMac.app
          codesign -d --entitlements - --xml dist/GSYCleanMac.app > /tmp/ents.xml || true
          codesign -d -vvv dist/GSYCleanMac.app 2>&1 | grep -E "Identifier|Authority|Sealed|TeamIdentifier|Runtime" || true
          # 验证 Hardened Runtime 真的开了
          # ad-hoc 签名后 flags 形如 0x10002(adhoc,runtime), 真正 Developer ID 签是 0x10000(runtime),
          # 用 grep "(.*runtime" 匹配两种形态; 用括号锁定避免误命中文件名/路径里的 runtime 字串
          # 注意: 必须先缓存到变量再 grep, 不能 codesign | grep -q —— -q 会提前 quit,
          # 在 set -o pipefail 下让 codesign 收 SIGPIPE 退出非 0, 误触发 if 失败分支
          CS_OUT=$(codesign -d -vvv dist/GSYCleanMac.app 2>&1 || true)
          if ! echo "$CS_OUT" | grep -Eq "flags=0x[0-9a-fA-F]+\([^)]*runtime"; then
            echo "::warning::Hardened Runtime flag 未检出（可能 codesign 版本不显示，不致命）"
          fi

      - name: Make DMG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          chmod +x Scripts/make_dmg.sh
          ./Scripts/make_dmg.sh \
            dist/GSYCleanMac.app \
            dist/GSYCleanMac-${VERSION}.dmg

      - name: Make .app.zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ditto -c -k --keepParent \
            dist/GSYCleanMac.app \
            dist/GSYCleanMac-${VERSION}.app.zip
          ls -lh dist/GSYCleanMac-${VERSION}.app.zip

      - name: SHA256 checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cd dist
          shasum -a 256 GSYCleanMac-${VERSION}.dmg \
            > GSYCleanMac-${VERSION}.dmg.sha256
          shasum -a 256 GSYCleanMac-${VERSION}.app.zip \
            > GSYCleanMac-${VERSION}.app.zip.sha256
          cat GSYCleanMac-${VERSION}.dmg.sha256
          cat GSYCleanMac-${VERSION}.app.zip.sha256

      - name: Minisign artifacts (optional)
        # v1.5.7：可选的 minisign 离线签名，完全不依赖 Apple Developer Program。
        #
        # 触发条件：仓库 Settings → Secrets → MINISIGN_PRIVATE_KEY 已配置
        #   - 私钥本地用 `minisign -G -p minisign.pub -s minisign.key` 生成
        #   - 私钥内容（含密码或 unencrypted）粘贴到 GitHub Secret
        #   - 如果私钥有密码，再配 MINISIGN_PASSWORD secret；无密码留空
        #   - 公钥 minisign.pub 提交到仓库根目录供用户下载验签
        #
        # 没有 secret 时整个 step 安静跳过，不影响 release 发布。
        # 这是免费 Personal Team 用户能拿到的"最接近 Sparkle EdDSA"的供应链信任方案：
        #   - 用户拿到 .dmg + .dmg.minisig + minisign.pub
        #   - 跑 `minisign -Vm GSYCleanMac-x.y.z.dmg -p minisign.pub`
        #   - 一致 → 确认产物没有在 GitHub Releases CDN 被中间人改过
        if: env.MINISIGN_PRIVATE_KEY != ''
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          brew install minisign
          # 把 secret 写到临时私钥文件（runner 销毁时自动清掉）
          printf '%s' "$MINISIGN_PRIVATE_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
          cd dist
          # -W 表示从 stdin 读密码；-x 指定签名输出路径
          if [ -n "${MINISIGN_PASSWORD:-}" ]; then
            printf '%s' "$MINISIGN_PASSWORD" | \
              minisign -S -s /tmp/minisign.key -m GSYCleanMac-${VERSION}.dmg -x GSYCleanMac-${VERSION}.dmg.minisig <&0
            printf '%s' "$MINISIGN_PASSWORD" | \
              minisign -S -s /tmp/minisign.key -m GSYCleanMac-${VERSION}.app.zip -x GSYCleanMac-${VERSION}.app.zip.minisig <&0
          else
            # 无密码私钥：用 echo 喂空 stdin
            echo | minisign -S -s /tmp/minisign.key -m GSYCleanMac-${VERSION}.dmg -x GSYCleanMac-${VERSION}.dmg.minisig
            echo | minisign -S -s /tmp/minisign.key -m GSYCleanMac-${VERSION}.app.zip -x GSYCleanMac-${VERSION}.app.zip.minisig
          fi
          ls -lh GSYCleanMac-${VERSION}.dmg.minisig GSYCleanMac-${VERSION}.app.zip.minisig
          rm -f /tmp/minisign.key

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSYCleanMac-${{ steps.ver.outputs.version }}-dist
          path: |
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.dmg
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.dmg.sha256
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.dmg.minisig
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.app.zip
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.app.zip.sha256
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.app.zip.minisig
          if-no-files-found: warn
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GSYCleanMac ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## GSYCleanMac ${{ github.ref_name }}

            macOS 清理管家 · Release 构建（ad-hoc 签名，无 Apple Developer Program）。
            产物：`.dmg`（推荐桌面用户）/ `.app.zip`（更小，便于自动化更新）/ 配套 `.sha256`。

            ---

            ### 📦 安装步骤

            **1. 下载并放进 Applications**

            - 选 `GSYCleanMac-${{ steps.ver.outputs.version }}.dmg`：双击挂载 → 把 `GSYCleanMac.app` 拖进 `/Applications`
            - 或选 `GSYCleanMac-${{ steps.ver.outputs.version }}.app.zip`：解压 → 把得到的 `GSYCleanMac.app` 拖进 `/Applications`

            **2. 首次启动 · trust 一次（重要）**

            因为是 ad-hoc 签名（与 Rectangle / AltTab / Stats 等开源项目一致），首次启动 Gatekeeper 会拦下并提示"无法打开，因为 Apple 无法检查它是否包含恶意软件"。**这是预期行为**，按以下流程一次性 trust：

            1. 在 `/Applications` 里双击 `GSYCleanMac.app`，看到拦截弹窗后点"完成"或"取消"
            2. 打开「系统设置」 → 「隐私与安全」
            3. 滚动到底部「安全性」区域，能看到一行："已阻止 GSYCleanMac 的使用，因为它不是来自被认证的开发者"
            4. 点击该行右侧的「仍要打开」，输入登录密码确认
            5. 之后双击 `.app` 即可正常启动（macOS 13–14 用户也可右键 .app → 选「打开」走旧版 trust 流程）

            **3. 授予「完全磁盘访问」（强烈建议）**

            扫描 `~/Library/Mail`、其他用户 Home、iCloud 占位文件等需要 TCC 权限：

            1. 「系统设置」 → 「隐私与安全」 → 「完全磁盘访问权限」
            2. 点 `+`，定位 `/Applications/GSYCleanMac.app`，添加并打开开关
            3. 重启 GSYCleanMac

            > 没授权也能用，但扫描结果会缺一截 —— App 内首次扫描检测到大量 `errno=1` 时会自动弹引导横幅。

            ---

            ### 🛟 安装故障兜底

            如果首次启动提示 **"应用已损坏，无法打开"** 或在新 macOS 找不到「仍要打开」按钮，**首选**按上面【步骤 2】走「系统设置 → 隐私与安全 → 仍要打开」，这是 Apple 官方推荐的、保留 Gatekeeper 防护的方式。

            如果你确认 .dmg/.app.zip 的 SHA256 与本页面 `*.sha256` 完全一致（见下方「完整性校验」），且仍无法通过 GUI 放行，可以 **作为最后手段** 自行决定是否在终端执行：

            ```bash
            # ⚠️ 这条命令会移除 Apple 的 quarantine 隔离标记，等同于绕过 Gatekeeper 二次校验。
            # 仅在你已经手动比对过 SHA256、信任本仓库时执行，且只对你刚下载的 .app 操作。
            xattr -cr /Applications/GSYCleanMac.app
            ```

            > 由于本项目当前使用 ad-hoc 临时签名（未购买 Apple Developer ID、未公证），Gatekeeper 提示是预期行为。如果你不接受任何形式的绕过，请等待后续 Developer ID + notarization 版本（参见 [docs/RELEASE.md](https://github.com/${{ github.repository }}/blob/main/docs/RELEASE.md) 路线图），或自行 fork 用你自己的 Developer ID 重新签名。

            ---

            ### ✅ 完整性校验

            **方式 1：SHA256（最低门槛）**

            ```bash
            shasum -a 256 GSYCleanMac-${{ steps.ver.outputs.version }}.dmg
            shasum -a 256 GSYCleanMac-${{ steps.ver.outputs.version }}.app.zip
            ```

            应分别输出与 `.dmg.sha256` / `.app.zip.sha256` 一致的哈希。SHA256 只能证明"下载的字节没坏"，无法证明发布者是谁。

            **方式 2：minisign 离线签名（推荐高级用户）**

            如果本次 Release 附带 `*.minisig` 文件（取决于发布者是否配置了 `MINISIGN_PRIVATE_KEY` secret），可以做发布者身份验签：

            ```bash
            brew install minisign
            # 公钥 minisign.pub 仓库根目录可下载，**首次需对照仓库 commit 历史确认未被替换**
            minisign -Vm GSYCleanMac-${{ steps.ver.outputs.version }}.dmg -p minisign.pub
            ```

            输出 `Signature and comment signature verified` 即为通过。minisign 用的是 ed25519 离线签名，不依赖 Apple Developer Program，等同 Rectangle / SwitchHosts 等开源项目正在使用的方案。

            > 设计权衡：本项目客户端**不自动下载也不自动安装**升级包（参见 `UpdateChecker.swift` 设计注释），所以没有 Sparkle EdDSA 那种"装在用户机器上的公钥强制验签"链路。minisign 是给愿意主动验签的用户的可选信任增强。

            ---

            ### 🔒 Hardened Runtime

            本次构建已开启 macOS Hardened Runtime（即使是 ad-hoc 签名也能启用），可阻止：

            - 任意 dyld 动态库注入
            - 未签名第三方代码加载到 GSYCleanMac 进程
            - 调试器附加到进程（除非显式 `entitlements.com.apple.security.get-task-allow=true`，本项目设为 false）

            验证方式：

            ```bash
            codesign -d -vvv /Applications/GSYCleanMac.app 2>&1 | grep -i runtime
            # 期望看到形如 flags=0x10002(adhoc,runtime) 的输出（ad-hoc 签名 + Hardened Runtime）
            # 或 flags=0x10000(runtime)（Developer ID 签名 + Hardened Runtime）
            ```

            ---

            ### 🧹 卸载

            1. 把 `/Applications/GSYCleanMac.app` 拖进废纸篓
            2. 删除 `~/Library/Application Support/GSYCleanMac/`（启发式数据）
            3. 删除 `~/Library/Preferences/com.guoshuyu.cleanmac.plist`
            4. （可选）「系统设置」 → 「隐私与安全」 → 「完全磁盘访问」中移除 GSYCleanMac

            ---

            ### 💡 为什么不需要 GitHub Secrets

            本项目使用 ad-hoc 签名（`codesign --sign -`），与 Rectangle / AltTab / Stats 等开源项目一致；签名身份是 GitHub runner 上即时生成的临时身份，不依赖任何 Apple Developer 证书或上传到 Secrets 的密钥。如需 Developer ID 公证签名版本，请 fork 后在 [Scripts/build_release.sh](https://github.com/${{ github.repository }}/blob/main/Scripts/build_release.sh) 设 `IDENTITY` 并配置自己的 keychain；完整说明见 [docs/RELEASE.md](https://github.com/${{ github.repository }}/blob/main/docs/RELEASE.md)。

            ---

            ### 📋 系统要求

            - macOS 15 Sequoia 或更高
            - Apple Silicon 或 Intel x86_64（universal binary）
            - 约 30 MB 磁盘
            - 完整安装文档：[docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)
          files: |
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.dmg
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.dmg.sha256
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.dmg.minisig
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.app.zip
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.app.zip.sha256
            dist/GSYCleanMac-${{ steps.ver.outputs.version }}.app.zip.minisig
          fail_on_unmatched_files: false
