name: GSYCleanMac
options:
  bundleIdPrefix: com.guoshuyu.cleanmac
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

# Debug / Release 双配置；Debug 默认 ad-hoc，命令行可用环境变量覆盖：
#   xcodebuild -configuration Debug \
#     CODE_SIGN_IDENTITY="${GSYCLEAN_CODESIGN_IDENTITY:--}" \
#     CODE_SIGN_STYLE=Manual build
# 见 Scripts/setup_codesign.sh 与 README "开发环境一次性配置"
configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    OTHER_SWIFT_FLAGS: "-warnings-as-errors"
  configs:
    Debug:
      # 本地开发：优先用 setup_codesign.sh 产出的稳定身份（解决 TCC 反复授权）
      # 命令行注入：CODE_SIGN_IDENTITY="$GSYCLEAN_CODESIGN_IDENTITY"
      # 未注入时退回 ad-hoc "-"
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES
    Release:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: YES

packages:
  ScanKit:
    path: Packages/ScanKit
  SafetyKit:
    path: Packages/SafetyKit
  XPCBridge:
    path: Packages/XPCBridge
  AppUI:
    path: Packages/AppUI
  HeuristicKit:
    path: Packages/HeuristicKit
  TestHarness:
    path: Packages/TestHarness

targets:
  GSYCleanMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/Assets.xcassets
    resources:
      - path: Resources/Rules
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GSY 清理管家
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 GuoShuYu. All rights reserved."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/GSYCleanMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /
    dependencies:
      - package: ScanKit
      - package: SafetyKit
      - package: XPCBridge
      - package: AppUI
      - package: HeuristicKit
      - target: GSYCleanMacHelper
        embed: true
        copy:
          destination: executables
          subpath: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guoshuyu.cleanmac.GSYCleanMac
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GSYCleanMacHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    info:
      path: Helper/Info.plist
      properties:
        CFBundleIdentifier: com.guoshuyu.cleanmac.helper
        CFBundleName: GSYCleanMacHelper
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.1.0"
    entitlements:
      path: Helper/Helper.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: XPCBridge
      - package: SafetyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guoshuyu.cleanmac.helper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: NO

schemes:
  GSYCleanMac:
    build:
      targets:
        GSYCleanMac: all
        GSYCleanMacHelper: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
