  # ========== macOS 安装器残留（Step 17-C / docs/AUDIT_2026_06.md L491） ==========
  # 用户级 installer cache 实测会累积数十 MB（如 com.apple.installer.osinstallersetupd），
  # 系统级 /private/var/db/receipts 已在 SafetyEngine.hardForbidPrefixes 硬禁区，
  # 这里加 verdict=forbid 多重防御让 UI 能展示 reason 并形成"早失败"双层保险。
  - name: "macOS Installer Leftovers"
    note: "macOS 系统安装器与 pkg 安装产物缓存（Step 17-C）"
    paths:
      # —— 用户级 installer cache（safe，可重建） ——
      - path: "~/Library/Caches/com.apple.installer*"
        verdict: "safe"
        reason: "macOS 安装器缓存（如 osinstallersetupd），下次安装时重建"
      - path: "~/Library/Caches/INSTALLATION"
        verdict: "safe"
        reason: "通用安装器中间产物"
      # —— 用户级 installer log（confirm，调试期间可能要复盘） ——
      - path: "~/Library/Logs/Install.log"
        verdict: "confirm"
        reason: "macOS 升级日志，删了无法复盘最近一次安装失败"
      # —— 系统级 receipts（forbid，多重防御，与 SafetyEngine.hardForbidPrefixes 重叠） ——
      - path: "/private/var/db/receipts"
        verdict: "forbid"
        reason: "系统级 .bom/.plist；删后 pkg --forget 失败 + 后续 macOS 更新检测异常"

  # ========== GPU / Metal shader 缓存（Step 17-E / docs/AUDIT_2026_06.md L123） ==========
  # com.apple.{gpuarchiver,metal,metalfe} 三套是 GPU 命令归档 / Metal shader / Metal
  # Frontend Compiler 缓存，按需重建，安全可清；macOS 重启或 GPU 程序首次启动会自动重建。
  # 系统级 /Library/Caches/com.apple.metal 不在硬禁区但删后影响所有用户首启编译，置 confirm。
  - name: "GPU/Metal Shader Cache"
    note: "GPU 命令归档与 Metal shader 编译缓存（Step 17-E）"
    paths:
      # —— 用户级（safe，按需重建） ——
      - path: "~/Library/Caches/com.apple.metal"
        verdict: "safe"
        reason: "用户级 Metal shader 缓存，下次启动 GPU 程序时按需重建"
      - path: "~/Library/Caches/com.apple.metalfe"
        verdict: "safe"
        reason: "Metal Frontend Compiler 缓存，按需重建"
      - path: "~/Library/Caches/com.apple.gpuarchiver"
        verdict: "safe"
        reason: "GPU 命令归档缓存，按需重建"
      # —— 系统级（confirm，删除将影响所有用户的首启编译） ——
      - path: "/Library/Caches/com.apple.metal"
        verdict: "confirm"
        reason: "系统级 Metal 缓存，删除安全但全用户首次启动 GPU 程序需重新编译"

