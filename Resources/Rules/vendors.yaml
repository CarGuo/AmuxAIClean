# vendors.yaml — 厂商清理规则（v1.0 已清洗版）
# 来源：SeedingTool 抓取 → 人工/脚本清洗，仅保留**带 bundle_id_prefix** 的有效规则。
# 命中规则会进入 SafetyEngine.evaluate，UI 默认 unchecked + 显示提示。
#
# **重要**：每条规则在加载到 SafetyEngine 时会经过 hardForbid 反向校验，
#  写错也不会误删 /System 等危险目录（PITFALLS §5.9）。
#
# 历史：早期 SeedingTool 自动抓取产生 159 条，含大量无 bundle_id_prefix 的脏条目
# （com.apple.* 系统组件、Caches、AddressBook 等），v1.0 清洗后保留 36 条有效厂商。

vendors:
