<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AmuxAIClean Normal Flow Prototype</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --text: #17191c;
      --muted: #6f747b;
      --line: rgba(22, 28, 36, 0.11);
      --accent: #0a84ff;
      --safe: #2fa45c;
      --review: #e79a23;
      --danger: #d94a4a;
      --shadow: 0 22px 70px rgba(27, 35, 46, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 980px;
      min-height: 720px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      letter-spacing: 0;
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .window {
      position: fixed;
      inset: 24px;
      min-width: 920px;
      min-height: 660px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .toolbar {
      height: 62px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
    }

    .traffic { display: flex; gap: 8px; }
    .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
    .traffic i:nth-child(1) { background: #ff5f57; }
    .traffic i:nth-child(2) { background: #febc2e; }
    .traffic i:nth-child(3) { background: #28c840; }

    .brand { font-size: 17px; font-weight: 650; }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      width: 250px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
    }

    .mode-switch button {
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .mode-switch button.active {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      font-weight: 600;
    }

    .stage {
      position: absolute;
      inset: 63px 0 0;
      display: grid;
      place-items: center;
      overflow: auto;
      background: var(--surface);
    }

    .stage[hidden] { display: none; }

    .normal-screen {
      width: min(760px, calc(100% - 64px));
      min-height: 100%;
      padding: 30px 0 38px;
      display: grid;
      place-items: center;
    }

    .screen { display: none; width: 100%; }
    .screen.active { display: block; animation: screen-in 320ms ease both; }

    @keyframes screen-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .idle { text-align: center; }

    .idle-visual {
      position: relative;
      width: 292px;
      height: 318px;
      margin: 0 auto;
      display: grid;
      place-items: start center;
    }

    .idle-track {
      position: relative;
      width: 252px;
      height: 252px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(10, 132, 255, 0.15);
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 2.5%, var(--surface));
    }

    .idle-track::before {
      content: "";
      position: absolute;
      inset: -1px;
      border: 2px solid transparent;
      border-top-color: rgba(10, 132, 255, 0.42);
      border-right-color: rgba(10, 132, 255, 0.14);
      border-radius: 50%;
      animation: idle-track 8s linear infinite;
    }

    .idle-track::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -17px;
      width: 74px;
      height: 1px;
      background: rgba(10, 132, 255, 0.2);
      transform: translateX(-50%);
    }

    @keyframes idle-track { to { transform: rotate(360deg); } }

    .mark-crop {
      width: 168px;
      height: 168px;
      overflow: hidden;
      border-radius: 39px;
      box-shadow: 0 16px 35px rgba(10, 132, 255, 0.2);
    }

    .mark-crop img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.34);
    }

    .scan-button {
      position: relative;
      width: 104px;
      height: 104px;
      position: absolute;
      left: 50%;
      bottom: 0;
      margin: 0;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(10, 132, 255, 0.28);
      animation: breathe 2.4s ease-in-out infinite;
    }

    .scan-button::before {
      content: "";
      position: absolute;
      inset: -8px;
      border: 2px solid rgba(10, 132, 255, 0.2);
      border-radius: 50%;
    }

    .scan-button .magnify {
      display: block;
      width: 22px;
      height: 22px;
      margin: 0 auto 7px;
      border: 3px solid currentColor;
      border-radius: 50%;
      position: relative;
    }

    .scan-button .magnify::after {
      content: "";
      position: absolute;
      width: 9px;
      height: 3px;
      right: -7px;
      bottom: -4px;
      border-radius: 2px;
      background: currentColor;
      transform: rotate(45deg);
    }

    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.045); }
    }

    .working { text-align: center; }

    .orbit {
      position: relative;
      width: 242px;
      height: 242px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border: 14px solid rgba(30, 40, 55, 0.07);
      border-radius: 50%;
    }

    .orbit::before {
      content: "";
      position: absolute;
      inset: -14px;
      border: 14px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent);
      border-radius: 50%;
      animation: spin 1.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .orbit-content .mark-crop {
      width: 66px;
      height: 66px;
      border-radius: 16px;
      box-shadow: 0 7px 18px rgba(10, 132, 255, 0.17);
      margin: 0 auto;
    }

    .orbit-value {
      margin-top: 9px;
      font-size: 28px;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }

    .orbit-caption { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .activity { margin: 18px 0 24px; font-size: 21px; font-weight: 650; }

    .steps {
      width: min(620px, 100%);
      margin: 0 auto 22px;
      display: grid;
      grid-template-columns: 1fr 34px 1fr 34px 1fr 34px 1fr;
      align-items: start;
    }

    .connector { height: 1px; margin-top: 14px; background: var(--line); }
    .connector.done { background: color-mix(in srgb, var(--safe) 55%, transparent); }

    .step { color: var(--muted); font-size: 12px; }
    .step .dot {
      width: 28px;
      height: 28px;
      margin: 0 auto 6px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--line);
    }

    .step.active { color: var(--text); font-weight: 600; }
    .step.active .dot { color: var(--accent); border-color: rgba(10, 132, 255, 0.28); }
    .step.active .dot::before { content: ""; width: 10px; height: 10px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
    .step.done .dot { color: var(--safe); background: color-mix(in srgb, var(--safe) 10%, var(--surface)); }
    .step.done .dot::before { content: "✓"; font-weight: 750; }

    .button {
      min-height: 38px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-2);
      cursor: pointer;
    }

    .button.primary { border-color: transparent; background: var(--accent); color: #fff; font-weight: 620; }
    .button.danger { border-color: transparent; background: var(--danger); color: #fff; font-weight: 620; }
    .button.icon { width: 40px; padding: 0; font-size: 17px; }
    .button:disabled { opacity: .46; cursor: default; }

    .result {
      height: calc(100vh - 171px);
      min-height: 510px;
      max-height: 690px;
      padding: 0 0 8px;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
    }
    .result.active { display: grid; }
    .result-header { min-height: 184px; }
    .result-top { display: flex; justify-content: flex-start; margin-bottom: 4px; }

    .result-hero { text-align: center; margin-bottom: 14px; }

    .result-ring {
      width: 142px;
      height: 142px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: conic-gradient(var(--safe) 0 70%, var(--review) 70% 100%);
      position: relative;
    }

    .result-ring::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      background: var(--surface);
    }

    .result-readout { position: relative; z-index: 1; }
    .result-readout strong { display: block; font-size: 25px; font-variant-numeric: tabular-nums; }
    .result-readout span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
    .result-title { margin: 8px 0 0; font-size: 20px; font-weight: 650; }

    .result.expanded .result-header {
      min-height: 112px;
      display: grid;
      grid-template-columns: 160px minmax(240px, 1fr) 160px;
      align-items: center;
    }

    .result.expanded .result-top { margin: 0; }
    .result.expanded .result-hero {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0;
    }
    .result.expanded .result-ring { width: 92px; height: 92px; margin: 0; }
    .result.expanded .result-ring::after { inset: 10px; }
    .result.expanded .result-readout strong { font-size: 18px; }
    .result.expanded .result-readout span { font-size: 11px; }
    .result.expanded .result-title { margin: 0; font-size: 18px; white-space: nowrap; }

    .selection-scroll {
      min-height: 0;
      overflow: auto;
      padding: 0 2px 3px;
      scrollbar-gutter: stable;
    }

    .category-list, .risk-summary {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
    }

    .category + .category { border-top: 1px solid var(--line); }

    .category-head {
      min-height: 52px;
      display: grid;
      grid-template-columns: 28px 32px minmax(120px, 1fr) auto 26px;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
    }

    .category-head button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .tri-check { width: 22px; height: 22px; accent-color: var(--accent); }
    .category-icon {
      width: 26px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 9%, var(--surface));
      font-size: 9px;
      font-weight: 750;
    }
    .category-icon.apps { color: #6875df; background: color-mix(in srgb, #6875df 10%, var(--surface)); }
    .category-icon.dev { color: #1f9d8b; background: color-mix(in srgb, #1f9d8b 10%, var(--surface)); font-size: 8px; }
    .category-title { font-weight: 610; text-align: left; }
    .category-size { font-variant-numeric: tabular-nums; font-weight: 620; white-space: nowrap; }
    .chevron { color: var(--muted); transition: transform 220ms ease; }
    .category.open .chevron { transform: rotate(90deg); }

    .category-items {
      display: none;
      max-height: 240px;
      overflow: auto;
      margin-left: 50px;
      border-top: 1px solid var(--line);
      background: var(--surface-2);
    }

    .category.open .category-items { display: block; animation: expand-in 220ms ease both; }

    @keyframes expand-in {
      from { opacity: 0; max-height: 0; }
      to { opacity: 1; max-height: 240px; }
    }

    .item-row {
      min-height: 42px;
      display: grid;
      grid-template-columns: 28px minmax(120px, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
    }

    .item-row + .item-row { border-top: 1px solid var(--line); }
    .item-row input { width: 16px; height: 16px; accent-color: var(--accent); }
    .item-row span:first-of-type { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-size { color: var(--muted); font-variant-numeric: tabular-nums; }

    .risk-summary {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 48px;
      background: color-mix(in srgb, var(--review) 5%, var(--surface));
    }

    .risk-summary button {
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0 14px;
      cursor: pointer;
    }

    .risk-summary button + button { border-left: 1px solid var(--line); }
    .risk-summary .review { color: var(--review); }
    .risk-summary .protected { color: var(--danger); }
    .risk-summary strong { color: var(--text); margin-left: 6px; }
    .risk-summary small { color: var(--muted); margin-left: 6px; }

    .risk-drawer {
      display: none;
      margin-top: 8px;
      border: 1px solid color-mix(in srgb, var(--review) 28%, var(--line));
      border-radius: 8px;
      background: color-mix(in srgb, var(--review) 4%, var(--surface));
      overflow: hidden;
    }

    .risk-drawer.open { display: block; animation: screen-in 220ms ease both; }
    .risk-item { min-height: 50px; padding: 7px 14px; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; }
    .risk-item + .risk-item { border-top: 1px solid var(--line); }
    .risk-item p { margin: 2px 0 0; color: var(--review); font-size: 12px; }

    .result-actions {
      margin-top: 0;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding-top: 2px;
    }

    .ai-summary { min-height: 20px; margin-top: 10px; text-align: center; color: var(--muted); font-size: 13px; }

    .simple-state { text-align: center; }
    .simple-state .state-symbol { font-size: 94px; line-height: 1; color: var(--safe); }
    .simple-state h2 { margin: 16px 0 7px; font-size: 24px; }
    .simple-state p { margin: 0 0 18px; color: var(--muted); }

    .clean-meter {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      border: 14px solid rgba(30, 40, 55, 0.07);
      border-radius: 50%;
    }

    .clean-meter::before {
      content: "";
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      border: 14px solid transparent;
      border-top-color: var(--safe);
      border-right-color: var(--safe);
      animation: spin 1.8s linear infinite;
    }

    .clean-meter .mark-crop { width: 74px; height: 74px; border-radius: 18px; margin: 0 auto; }
    .clean-progress { margin-top: 9px; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .modal-layer {
      position: absolute;
      inset: 63px 0 0;
      display: none;
      place-items: center;
      padding: 28px;
      background: rgba(18, 22, 28, 0.24);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .modal-layer.open { display: grid; }

    .modal {
      width: min(580px, calc(100% - 48px));
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.23);
      overflow: hidden;
    }

    .modal header { padding: 20px; border-bottom: 1px solid var(--line); }
    .modal h2 { margin: 0; font-size: 21px; }
    .modal header p { margin: 5px 0 0; color: var(--muted); }
    .modal-body { padding: 18px 20px; }

    .warning-band { padding: 12px; border-radius: 7px; background: color-mix(in srgb, var(--review) 9%, var(--surface)); color: color-mix(in srgb, var(--review) 82%, var(--text)); }

    .preview-row { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .preview-row span:last-child { font-variant-numeric: tabular-nums; }

    .modal footer { min-height: 62px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
    .dry-run { margin-right: auto; display: flex; align-items: center; gap: 9px; }
    .dry-run input { width: 35px; height: 20px; accent-color: var(--accent); }

    .professional-shell {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 250px 1fr;
    }

    .professional-sidebar { padding: 18px 14px; border-right: 1px solid var(--line); background: var(--surface-2); }
    .professional-sidebar h3 { margin: 6px 8px 12px; color: var(--muted); font-size: 12px; text-transform: uppercase; }
    .professional-sidebar button { width: 100%; height: 38px; border: 0; border-radius: 6px; background: transparent; text-align: left; padding: 0 10px; cursor: pointer; }
    .professional-sidebar button.active { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); color: var(--accent); font-weight: 600; }
    .professional-content { display: grid; place-items: center; color: var(--muted); }
    .professional-content strong { display: block; margin-top: 10px; color: var(--text); font-size: 20px; }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17191d;
        --surface: #24272c;
        --surface-2: #2c3036;
        --text: #f3f4f6;
        --muted: #a6abb3;
        --line: rgba(255, 255, 255, 0.11);
        --shadow: 0 22px 70px rgba(0, 0, 0, 0.48);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
    }
  </style>
</head>
<body>
  <main class="window" aria-label="AmuxAIClean UX prototype">
    <header class="toolbar">
      <span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand">AmuxAIClean</span>
      <nav class="mode-switch" aria-label="界面模式">
        <button id="normalMode" class="active">Normal</button>
        <button id="professionalMode">Professional</button>
      </nav>
    </header>

    <section id="normalStage" class="stage">
      <div class="normal-screen">
        <section id="idleScreen" class="screen idle active">
          <div class="idle-visual">
            <div class="idle-track">
              <div class="mark-crop"><img src="../../Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" alt=""></div>
            </div>
            <button id="scanButton" class="scan-button"><span class="magnify" aria-hidden="true"></span>扫描</button>
          </div>
        </section>

        <section id="scanningScreen" class="screen working">
          <div class="orbit">
            <div class="orbit-content">
              <div class="mark-crop"><img src="../../Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" alt=""></div>
              <div id="scanBytes" class="orbit-value">0 KB</div>
              <div class="orbit-caption">当前发现的安全容量</div>
            </div>
          </div>
          <div id="activity" class="activity">正在扫描基础位置</div>
          <div id="steps" class="steps" aria-label="扫描阶段"></div>
          <button id="stopButton" class="button">■&nbsp;&nbsp;停止</button>
        </section>

        <section id="resultScreen" class="screen result">
          <div class="result-header">
            <div class="result-top"><button id="rescanButton" class="button">↻&nbsp;&nbsp;重新扫描</button></div>
            <div class="result-hero">
              <div class="result-ring"><div class="result-readout"><strong id="selectedTotal">49.7 GB</strong><span>安全可清理</span></div></div>
              <div class="result-title">扫描完成</div>
            </div>
          </div>
          <div class="selection-scroll">
            <div id="categoryList" class="category-list"></div>
            <div class="risk-summary">
              <button id="reviewToggle" class="review">△ <strong>21.4 GB</strong><small>需要确认</small></button>
              <button id="protectedToggle" class="protected">◇ <strong>164 KB</strong><small>已保护</small></button>
            </div>
            <div id="reviewDrawer" class="risk-drawer"></div>
            <div id="protectedDrawer" class="risk-drawer"></div>
            <div id="aiSummary" class="ai-summary"></div>
          </div>
          <div class="result-actions">
            <button id="previewButton" class="button primary">▣&nbsp;&nbsp;预览清理</button>
            <button id="aiButton" class="button">✦&nbsp;&nbsp;AI 判断</button>
          </div>
        </section>

        <section id="cancelledScreen" class="screen simple-state">
          <div class="state-symbol" style="color:var(--muted)">Ⅱ</div>
          <h2>扫描已停止</h2>
          <p>未改动任何文件</p>
          <button id="continueButton" class="button primary">继续扫描</button>
          <button id="restartButton" class="button">重新开始</button>
        </section>

        <section id="cleaningScreen" class="screen simple-state">
          <div class="clean-meter">
            <div>
              <div class="mark-crop"><img src="../../Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png" alt=""></div>
              <div id="cleanProgress" class="clean-progress">0 / 884</div>
            </div>
          </div>
          <h2>正在移到废纸篓</h2>
          <p>可从 Finder 废纸篓恢复</p>
        </section>

        <section id="completedScreen" class="screen simple-state">
          <div class="state-symbol">✓</div>
          <h2>清理完成</h2>
          <p>已释放 49.7 GB · 884 项已移到废纸篓</p>
          <button id="scanAgainButton" class="button primary">↻&nbsp;&nbsp;再次扫描</button>
          <button class="button">查看最近清理</button>
        </section>
      </div>
    </section>

    <section id="professionalStage" class="stage" hidden>
      <div class="professional-shell">
        <aside class="professional-sidebar">
          <h3>专业工具</h3>
          <button class="active">推荐清理</button>
          <button>开发缓存</button>
          <button>大文件</button>
          <button>App 残留</button>
          <button>重复文件</button>
        </aside>
        <div class="professional-content">
          <div style="text-align:center"><span style="font-size:48px">⌘</span><strong>专业工作区保持独立</strong><span>切换模式不会带入 Normal 结果或勾选</span></div>
        </div>
      </div>
    </section>

    <div id="modalLayer" class="modal-layer" role="presentation">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header><h2 id="modalTitle">清理预览</h2><p id="modalSummary">已选 884 项 · 49.7 GB</p></header>
        <div class="modal-body">
          <div class="warning-band">部分相关 App 正在运行；真实清理前需要退出这些 App。</div>
          <div class="preview-row"><span>系统日志</span><span id="previewLogsSize">535.9 MB</span></div>
          <div class="preview-row"><span>App 缓存</span><span id="previewAppsSize">18.5 GB</span></div>
          <div class="preview-row"><span>开发缓存</span><span id="previewDevSize">30.6 GB</span></div>
        </div>
        <footer>
          <label class="dry-run"><input id="dryRun" type="checkbox" checked>仅预览（dry-run）</label>
          <button id="cancelModal" class="button">取消</button>
          <button id="confirmAction" class="button primary">运行预览</button>
        </footer>
      </section>
    </div>
  </main>

  <script>
    const screens = {
      idle: document.querySelector('#idleScreen'),
      scanning: document.querySelector('#scanningScreen'),
      result: document.querySelector('#resultScreen'),
      cancelled: document.querySelector('#cancelledScreen'),
      cleaning: document.querySelector('#cleaningScreen'),
      completed: document.querySelector('#completedScreen')
    };

    const categories = [
      { id: 'logs', icon: 'LOG', name: '系统日志', items: [
        ['Huawei', 210.6], ['Google', 194.6], ['AmuxAIClean', 61.1], ['CoreSimulator', 33.3], ['JetBrains', 8.3], ['其他日志', 28.0]
      ]},
      { id: 'apps', icon: 'APP', name: 'App 缓存', items: [
        ['Google', 8120], ['WeChat', 4380], ['Safari', 2110], ['JetBrains', 1760], ['Preview', 1290], ['其他 App 缓存', 870]
      ]},
      { id: 'dev', icon: '&lt;/&gt;', name: '开发缓存', items: [
        ['Xcode DerivedData', 14600], ['CoreSimulator', 6820], ['SwiftPM', 3440], ['Node', 2510], ['Android', 1980], ['Python', 1290]
      ]}
    ];

    const reviewItems = [
      { name: 'WeChat 文档缓存', size: 8120, reason: '可能包含需要再次下载的数据', selected: false },
      { name: 'Downloads 中的安装包', size: 6540, reason: '属于个人文件，清理前必须确认', selected: false },
      { name: '旧模拟器数据', size: 6740, reason: '可能需要重新安装模拟器运行时', selected: false }
    ];

    const protectedItems = [
      ['当前 App 运行数据', '正在使用，禁止处理'],
      ['系统保护路径', '被本地安全策略拦截']
    ];

    let normalState = 'idle';
    let scanningTimer = null;
    let cleanTimer = null;
    let scanStage = 0;
    let openCategory = null;
    let mode = 'normal';

    for (const category of categories) {
      category.items = category.items.map(([name, size]) => ({ name, size, selected: true }));
    }

    function formatMB(value) {
      if (value >= 1000) return `${(value / 1000).toFixed(value >= 10000 ? 1 : 2)} GB`;
      if (value < 1) return `${Math.round(value * 1024)} KB`;
      return `${value.toFixed(1)} MB`;
    }

    function safeSelectedMB() {
      return categories.flatMap(category => category.items).filter(item => item.selected).reduce((sum, item) => sum + item.size, 0);
    }

    function setScreen(next) {
      normalState = next;
      for (const [name, screen] of Object.entries(screens)) screen.classList.toggle('active', name === next);
      location.hash = next;
    }

    function setMode(next) {
      mode = next;
      document.querySelector('#normalMode').classList.toggle('active', next === 'normal');
      document.querySelector('#professionalMode').classList.toggle('active', next === 'professional');
      document.querySelector('#normalStage').hidden = next !== 'normal';
      document.querySelector('#professionalStage').hidden = next !== 'professional';
    }

    const stepLabels = ['基础检查', 'App 缓存', '开发缓存', '安全校验'];
    const activities = ['正在扫描基础位置', '正在扫描 App 缓存', '正在扫描开发缓存', '最终安全校验'];
    const stageBytes = [0, 535.9, 19065.9, 49705.9];

    function renderSteps() {
      const host = document.querySelector('#steps');
      host.innerHTML = stepLabels.map((label, index) => {
        const state = index < scanStage ? 'done' : index === scanStage ? 'active' : '';
        const connector = index < stepLabels.length - 1 ? `<div class="connector ${index < scanStage ? 'done' : ''}"></div>` : '';
        return `<div class="step ${state}"><div class="dot"></div>${label}</div>${connector}`;
      }).join('');
      document.querySelector('#activity').textContent = activities[scanStage];
      document.querySelector('#scanBytes').textContent = formatMB(stageBytes[scanStage]);
    }

    function startScan(fromStage = 0) {
      clearInterval(scanningTimer);
      scanStage = fromStage;
      setScreen('scanning');
      renderSteps();
      scanningTimer = setInterval(() => {
        if (scanStage < 3) {
          scanStage += 1;
          renderSteps();
        } else {
          clearInterval(scanningTimer);
          renderCategories();
          setScreen('result');
        }
      }, 1450);
    }

    function renderCategories() {
      const host = document.querySelector('#categoryList');
      document.querySelector('#resultScreen').classList.toggle('expanded', openCategory !== null);
      host.innerHTML = categories.map(category => {
        const selected = category.items.filter(item => item.selected);
        const selectedMB = selected.reduce((sum, item) => sum + item.size, 0);
        const totalMB = category.items.reduce((sum, item) => sum + item.size, 0);
        const size = selected.length === category.items.length ? formatMB(totalMB) : `${formatMB(selectedMB)} / ${formatMB(totalMB)}`;
        return `<section class="category ${openCategory === category.id ? 'open' : ''}" data-category="${category.id}">
          <div class="category-head">
            <input class="tri-check" type="checkbox" aria-label="选择${category.name}" data-check="${category.id}">
            <span class="category-icon ${category.id}">${category.icon}</span>
            <button class="category-title" data-open="${category.id}">${category.name}</button>
            <span class="category-size">${size}</span>
            <button class="chevron" data-open="${category.id}" aria-label="展开${category.name}">›</button>
          </div>
          <div class="category-items">${category.items.map((item, index) => `<label class="item-row"><input type="checkbox" data-item="${category.id}:${index}" ${item.selected ? 'checked' : ''}><span>${item.name}</span><span class="item-size">${formatMB(item.size)}</span></label>`).join('')}</div>
        </section>`;
      }).join('');

      for (const category of categories) {
        const checkbox = host.querySelector(`[data-check="${category.id}"]`);
        const selectedCount = category.items.filter(item => item.selected).length;
        checkbox.checked = selectedCount === category.items.length;
        checkbox.indeterminate = selectedCount > 0 && selectedCount < category.items.length;
      }

      host.querySelectorAll('[data-open]').forEach(button => button.addEventListener('click', () => {
        openCategory = openCategory === button.dataset.open ? null : button.dataset.open;
        renderCategories();
      }));

      host.querySelectorAll('[data-check]').forEach(input => input.addEventListener('change', () => {
        const category = categories.find(value => value.id === input.dataset.check);
        category.items.forEach(item => item.selected = input.checked);
        renderCategories();
        updateSelectionTotal();
      }));

      host.querySelectorAll('[data-item]').forEach(input => input.addEventListener('change', () => {
        const [id, index] = input.dataset.item.split(':');
        categories.find(value => value.id === id).items[Number(index)].selected = input.checked;
        renderCategories();
        updateSelectionTotal();
      }));
      updateSelectionTotal();
    }

    function updateSelectionTotal() {
      const total = safeSelectedMB() + reviewItems.filter(item => item.selected).reduce((sum, item) => sum + item.size, 0);
      document.querySelector('#selectedTotal').textContent = formatMB(total);
      document.querySelector('#modalSummary').textContent = `已选 ${categories.flatMap(category => category.items).filter(item => item.selected).length + reviewItems.filter(item => item.selected).length} 项 · ${formatMB(total)}`;
      const selectedByCategory = Object.fromEntries(categories.map(category => [
        category.id,
        category.items.filter(item => item.selected).reduce((sum, item) => sum + item.size, 0)
      ]));
      document.querySelector('#previewLogsSize').textContent = formatMB(selectedByCategory.logs);
      document.querySelector('#previewAppsSize').textContent = formatMB(selectedByCategory.apps);
      document.querySelector('#previewDevSize').textContent = formatMB(selectedByCategory.dev);
    }

    function renderReviewDrawer() {
      const host = document.querySelector('#reviewDrawer');
      host.innerHTML = reviewItems.map((item, index) => `<label class="risk-item"><input type="checkbox" data-review="${index}" ${item.selected ? 'checked' : ''}><span><strong>${item.name}</strong><p>${item.reason}</p></span><span class="item-size">${formatMB(item.size)}</span></label>`).join('');
      host.querySelectorAll('[data-review]').forEach(input => input.addEventListener('change', () => {
        reviewItems[Number(input.dataset.review)].selected = input.checked;
        updateSelectionTotal();
      }));
    }

    function renderProtectedDrawer() {
      document.querySelector('#protectedDrawer').innerHTML = protectedItems.map(([name, reason]) => `<div class="risk-item"><span style="color:var(--danger)">◇</span><span><strong>${name}</strong><p style="color:var(--danger)">${reason}</p></span><span class="item-size">已保护</span></div>`).join('');
    }

    function openPreview() { document.querySelector('#modalLayer').classList.add('open'); }
    function closePreview() { document.querySelector('#modalLayer').classList.remove('open'); }

    function startCleaning() {
      closePreview();
      setScreen('cleaning');
      clearInterval(cleanTimer);
      let completed = 0;
      cleanTimer = setInterval(() => {
        completed = Math.min(884, completed + 12);
        document.querySelector('#cleanProgress').textContent = `${completed} / 884`;
        if (completed === 884) {
          clearInterval(cleanTimer);
          setTimeout(() => setScreen('completed'), 420);
        }
      }, 180);
    }

    document.querySelector('#normalMode').addEventListener('click', () => setMode('normal'));
    document.querySelector('#professionalMode').addEventListener('click', () => setMode('professional'));
    document.querySelector('#scanButton').addEventListener('click', () => startScan());
    document.querySelector('#rescanButton').addEventListener('click', () => startScan());
    document.querySelector('#scanAgainButton').addEventListener('click', () => startScan());
    document.querySelector('#stopButton').addEventListener('click', () => { clearInterval(scanningTimer); setScreen('cancelled'); });
    document.querySelector('#continueButton').addEventListener('click', () => startScan(scanStage));
    document.querySelector('#restartButton').addEventListener('click', () => setScreen('idle'));
    document.querySelector('#previewButton').addEventListener('click', openPreview);
    document.querySelector('#cancelModal').addEventListener('click', closePreview);
    document.querySelector('#modalLayer').addEventListener('click', event => { if (event.target.id === 'modalLayer') closePreview(); });

    document.querySelector('#reviewToggle').addEventListener('click', () => {
      document.querySelector('#reviewDrawer').classList.toggle('open');
      document.querySelector('#protectedDrawer').classList.remove('open');
    });
    document.querySelector('#protectedToggle').addEventListener('click', () => {
      document.querySelector('#protectedDrawer').classList.toggle('open');
      document.querySelector('#reviewDrawer').classList.remove('open');
    });

    document.querySelector('#aiButton').addEventListener('click', () => {
      const button = document.querySelector('#aiButton');
      button.disabled = true;
      button.textContent = '判断中 0 / 18';
      let progress = 0;
      const timer = setInterval(() => {
        progress += 3;
        button.textContent = `判断中 ${Math.min(progress, 18)} / 18`;
        if (progress >= 18) {
          clearInterval(timer);
          button.disabled = false;
          button.innerHTML = '✦&nbsp;&nbsp;再次判断';
          document.querySelector('#aiSummary').textContent = 'AI 建议安全 12 · 建议复核 5 · 建议避开 1';
        }
      }, 260);
    });

    const dryRun = document.querySelector('#dryRun');
    const confirmAction = document.querySelector('#confirmAction');
    dryRun.addEventListener('change', () => {
      confirmAction.textContent = dryRun.checked ? '运行预览' : '移到废纸篓';
      confirmAction.classList.toggle('primary', dryRun.checked);
      confirmAction.classList.toggle('danger', !dryRun.checked);
    });
    confirmAction.addEventListener('click', () => {
      if (dryRun.checked) {
        document.querySelector('#modalTitle').textContent = '预览完成';
        document.querySelector('.warning-band').textContent = '预览未改动任何文件。关闭“仅预览”后才可授权移到废纸篓。';
      } else {
        const authorized = window.confirm('确认将当前已选内容移到废纸篓？');
        if (authorized) startCleaning();
      }
    });

    renderCategories();
    renderReviewDrawer();
    renderProtectedDrawer();

    const initial = location.hash.replace('#', '');
    if (initial === 'result') setScreen('result');
    if (initial === 'scanning') startScan(1);
    if (initial === 'cleaning') startCleaning();
    if (initial === 'completed') setScreen('completed');
  </script>
</body>
</html>
