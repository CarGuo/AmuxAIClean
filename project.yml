name: GSYCleanMac
options:
  bundleIdPrefix: com.guoshuyu.cleanmac
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    OTHER_SWIFT_FLAGS: "-warnings-as-errors"

packages:
  ScanKit:
    path: Packages/ScanKit
  SafetyKit:
    path: Packages/SafetyKit
  XPCBridge:
    path: Packages/XPCBridge
  AppUI:
    path: Packages/AppUI
  HeuristicKit:
    path: Packages/HeuristicKit
  TestHarness:
    path: Packages/TestHarness

targets:
  GSYCleanMac:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources/Assets.xcassets
    resources:
      - path: Resources/Rules
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GSY 清理管家
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright © 2026 GuoShuYu. All rights reserved."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/GSYCleanMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.absolute-path.read-only:
          - /
    dependencies:
      - package: ScanKit
      - package: SafetyKit
      - package: XPCBridge
      - package: AppUI
      - package: HeuristicKit
      - target: GSYCleanMacHelper
        embed: true
        copy:
          destination: executables
          subpath: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guoshuyu.cleanmac.GSYCleanMac
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  GSYCleanMacHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    info:
      path: Helper/Info.plist
      properties:
        CFBundleIdentifier: com.guoshuyu.cleanmac.helper
        CFBundleName: GSYCleanMacHelper
        CFBundleVersion: "2"
        CFBundleShortVersionString: "1.1.0"
    entitlements:
      path: Helper/Helper.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: XPCBridge
      - package: SafetyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guoshuyu.cleanmac.helper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: NO

schemes:
  GSYCleanMac:
    build:
      targets:
        GSYCleanMac: all
        GSYCleanMacHelper: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
