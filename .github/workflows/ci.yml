name: CI

# v2026.07.18：仓库 CI 当前完全停用。`workflow_dispatch` 只保留 Actions 页面入口，
# 但下面所有 job 都有 `if: false`，点击 Run workflow 也不会执行测试或构建。
# 当前权威验证与发布链路只在本地，分别以 AGENTS.md 完成门槛和 docs/RELEASE.md 为准；
# release.yml 同样停用，不能把它描述成真实发版兜底。
# 旧自动触发器（已禁用，保留以便日后想恢复时无需翻历史）：
# on:
#   push:
#     branches: [main, master]
#   pull_request:
#     branches: [main, master]
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift Package Tests
    runs-on: macos-15
    timeout-minutes: 25
    # v2026.07.18：显式停用；恢复前必须重新审计工具链、九包 gate 与签名边界。
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run all package tests
        shell: bash
        run: |
          set -euo pipefail
          fails=0
          # v2026.07.18: keep the dormant workflow aligned with the repository-wide
          # nine-package gate so re-enabling CI cannot silently omit newer packages.
          for pkg in ScanKit SafetyKit AppUI HeuristicKit LogKit BrewKit FileSearchKit AIKit TestHarness; do
            echo "::group::swift test - $pkg"
            if ! (cd "Packages/$pkg" && swift test --parallel); then
              fails=$((fails + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$fails" -gt 0 ]; then
            echo "::error::$fails package(s) had failing tests"
            exit 1
          fi

  xcode-build:
    name: Xcode Debug Build
    runs-on: macos-15
    timeout-minutes: 25
    needs: swift-test
    # v2026.07.18：显式停用。release.yml 也不会运行，公开产物只来自维护者本地流程。
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: xcodebuild Debug (ad-hoc)
        run: |
          set -o pipefail
          xcodebuild \
            -project GSYCleanMac.xcodeproj \
            -scheme GSYCleanMac \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/dd \
            build 2>&1 | tail -200

      - name: Verify .app exists
        run: |
          test -d build/dd/Build/Products/Debug/GSYCleanMac.app || {
            echo "::error::.app 未生成"
            exit 1
          }
          ls -la build/dd/Build/Products/Debug/GSYCleanMac.app/Contents/MacOS/
