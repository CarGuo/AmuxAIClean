name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-test:
    name: Swift Package Tests
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            Packages/*/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Run all package tests
        shell: bash
        run: |
          set -euo pipefail
          fails=0
          for pkg in ScanKit SafetyKit LogKit AppUI HeuristicKit TestHarness; do
            echo "::group::swift test - $pkg"
            if ! (cd "Packages/$pkg" && swift test --parallel); then
              fails=$((fails + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$fails" -gt 0 ]; then
            echo "::error::$fails package(s) had failing tests"
            exit 1
          fi

  xcode-build:
    name: Xcode Debug Build
    runs-on: macos-15
    timeout-minutes: 25
    needs: swift-test
    # Step 5.6 番外：CI 暂时屏蔽 xcodebuild job（Personal Team 签名只能本机用，
    # GitHub runner 上没 keychain，要么走 ad-hoc 要么上传 Developer ID p12，
    # 用户决定先省 Actions 额度，等需要发 Release 时再单独跑 release.yml）
    if: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: xcodebuild Debug (ad-hoc)
        run: |
          set -o pipefail
          xcodebuild \
            -project GSYCleanMac.xcodeproj \
            -scheme GSYCleanMac \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/dd \
            build 2>&1 | tail -200

      - name: Verify .app exists
        run: |
          test -d build/dd/Build/Products/Debug/GSYCleanMac.app || {
            echo "::error::.app 未生成"
            exit 1
          }
          ls -la build/dd/Build/Products/Debug/GSYCleanMac.app/Contents/MacOS/
