name: Release

# v2026.07.18：GitHub Release workflow 只保留一个明确停用的占位。
# 旧 job 构建 ad-hoc .app/.zip 并发布过时的 GSYCleanMac 安装说明，与当前唯一允许的
# “维护者本地 Developer ID 签名 -> 最终 DMG 公证 -> staple/validate -> SHA256”合同冲突。
# 与其保留一套可能被误恢复的第二发布实现，这里 fail closed；真实步骤只维护在
# docs/RELEASE.md，恢复 CI 前必须另行取得授权并从该合同重新设计。
on:
  workflow_dispatch:

jobs:
  release-disabled:
    name: Release workflow is disabled
    runs-on: macos-15
    if: false
    steps:
      - name: Disabled by repository release contract
        run: |
          echo "GitHub Actions release is disabled; use the authorized local docs/RELEASE.md flow."
